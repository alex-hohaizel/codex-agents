<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riverdesk | Field reports</title>
  <link rel="stylesheet" href="riverdesk.css">
  <script src="reports.js" defer></script>
  <script src="riverdesk.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="riverdesk.html">Riverdesk</a>
    <label for="role">Preview role</label>
    <select id="role"><option value="operator">Operator</option><option value="viewer">Viewer</option></select>
  </header>
  <main>
    <div class="heading"><p>Lower Fen Operations</p><h1>Field reports</h1></div>
    <div class="workspace">
      <section class="queue" aria-labelledby="queue-label">
        <h2 id="queue-label">Review queue</h2>
        <ul id="reports"></ul>
      </section>
      <section class="detail" aria-labelledby="report-title">
        <header><span id="report-id" class="reference"></span><h2 id="report-title"></h2></header>
        <p id="summary"></p>
        <details id="evidence"><summary>Review source evidence</summary>
          <dl><dt>Source</dt><dd id="source"></dd><dt>Recorded</dt><dd id="recorded"></dd><dt>Confidence</dt><dd id="confidence"></dd></dl>
        </details>
        <div class="actions">
          <button id="handoff" type="button" disabled>Send to duty reviewer</button>
          <button id="refresh" type="button" hidden>Refresh evidence</button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
