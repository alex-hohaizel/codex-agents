.signature{fill:#c6e3e5;font-size:31px;letter-spacing:2.2px;font-weight:700}
.title{fill:#f4fbf9;font-size:72px;font-weight:780;letter-spacing:-3.3px}
.title-color{fill:url(#hero-teal)}
.group-title{fill:#a1e8e3;font-size:31px;font-weight:700;letter-spacing:.2px}
.node{fill:#f4fbf9;font-size:40px;font-weight:720;letter-spacing:-.75px}
.detail{fill:#c1dbe0;font-size:29px;font-weight:480;letter-spacing:-.15px}
</style>
