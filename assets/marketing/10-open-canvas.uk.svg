<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Відкрите полотно</title><desc id="desc">Панорамне полотно показує діапазон через точні мініатюри проєктів. Камера переходить між бекендом, інтеграцією, сайтом, застосунком, ботом і мобільною грою зі спільним підходом.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#EFECE5" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#24292F" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#858981" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">10 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#858981" stroke-width="0.65"/><text x="64" y="151" fill="#E85B25" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Відкрите полотно</text><text x="61" y="229" fill="#24292F" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Від корисної задачі</text><text x="61" y="290" fill="#24292F" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">до світу, який хочеш</text><text x="61" y="351" fill="#24292F" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">створити.</text><text x="64" y="450" fill="#858981" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Панорамне полотно показує діапазон через точні</text><text x="64" y="478" fill="#858981" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">мініатюри проєктів.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#E85B25" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#EFECE5" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><path d="M770 1