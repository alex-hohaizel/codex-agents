<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Launch Garden</title><desc id="desc">An organic yet structured system makes long-term evolution approachable. Roots are requirements; branches are specialist disciplines; new versions preserve project knowledge.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#E9EDDC" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#203F32" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#738269" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">08 / DIRECTION STUDY</text><path d="M64 82L1536 82" fill="none" stroke="#738269" stroke-width="0.65"/><text x="64" y="151" fill="#3D6D45" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Launch Garden</text><text x="61" y="229" fill="#203F32" font-size="55" font-family="DejaVu Serif, Georgia, serif" font-weight="400">Grow the project</text><text x="61" y="290" fill="#203F32" font-size="55" font-family="DejaVu Serif, Georgia, serif" font-weight="400">without losing its</text><text x="61" y="351" fill="#203F32" font-size="55" font-family="DejaVu Serif, Georgia, serif" font-weight="400">roots.</text><text x="64" y="450" fill="#738269" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">An organic yet structured system makes long-term</text><text x="64" y="478" fill="#738269" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">evolution approachable.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#3D6D45" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#E9EDDC" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Your brief → your team</text><path d="M1160 538V420Q1160 365 95