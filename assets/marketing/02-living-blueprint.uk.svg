<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Живе креслення</title><desc id="desc">Технічне креслення, що розвивається в робочий продукт. Вимоги, архітектура й перевірки залишаються пов’язаними — від однієї проблеми бекенду до цілої системи.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F4F1E9" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#173451" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#6D7B86" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">02 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#6D7B86" stroke-width="0.65"/><text x="64" y="151" fill="#245EEA" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Живе креслення</text><text x="61" y="229" fill="#173451" font-size="52" font-family="DejaVu Serif, Georgia, serif" font-weight="400">Кожне рішення</text><text x="61" y="290" fill="#173451" font-size="52" font-family="DejaVu Serif, Georgia, serif" font-weight="400">залишає корисний</text><text x="61" y="351" fill="#173451" font-size="52" font-family="DejaVu Serif, Georgia, serif" font-weight="400">слід.</text><text x="64" y="450" fill="#6D7B86" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Технічне креслення, що розвивається в робочий</text><text x="64" y="478" fill="#6D7B86" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">продукт.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#245EEA" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#F4F1E9" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><path d="M780 140L780 588" fill="none" stroke="#D8DFE3" stroke-width="