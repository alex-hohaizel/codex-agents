<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Сузір’я продукту</title><desc id="desc">Змістовне сузір’я показує, як спеціалізовані сімейства об’єднуються навколо одного проєкту. Акцент — на співпраці дисциплін із чітким центром і зрозумілими зв’язками.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#121025" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#F5F1FF" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#A69ABC" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">03 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#A69ABC" stroke-width="0.65"/><text x="64" y="151" fill="#B99BFF" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Сузір’я продукту</text><text x="61" y="229" fill="#F5F1FF" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Потрібна експертиза</text><text x="61" y="290" fill="#F5F1FF" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">навколо твоєї мети.</text><text x="64" y="450" fill="#A69ABC" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Змістовне сузір’я показує, як спеціалізовані</text><text x="64" y="478" fill="#A69ABC" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">сімейства об’єднуються навколо одного проєкту.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#B99BFF" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#121025" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><path d="M1160 350L1170 174" fill="none" stroke="#A69ABC" stroke-width="1.6"/><path d="M1160 350L1430 298" fill="none" stroke="#A69ABC" stroke-width="1.6"/><path d="M1160 350L1340 504" fill="none" stroke="#A69ABC" stroke-width="1.6"/><path d="M1160 350L940 504" fill="none" stroke="#A69ABC" stroke-width="1.6"/><path d="M1160 350L875 290" fill="none" stroke="#A69ABC" stroke-width="1.6"/><circle cx="1160" cy="350" r="102" fill="#211B38" stroke="#B99BFF" stroke-width="2"/><text x="1101" y="340" fill="#B99BFF" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">ТВОЯ МЕТА</text><text x="1092" y="374" fill="#F5F1FF" font-size="22" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Один проєкт</text><circle cx="1170" cy="174" r="50" fill="#211B38" stroke="#B99BFF" stroke-width="2"/><text x="1093" y="250" fill="#F5F1FF" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Agent Builder</text><g transform="translate(1157 152) scale(0.9)"><path d="M0 12L-10 22L0 32M24 12L34 22L24 32M17 5L7 39" fill="none" stroke="#B99BFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="1430" cy="298" r="50" fill="#211B38" stroke="#62E4DA" stroke-width="2"/><text x="1353" y="374" fill="#F5F1FF" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">App Atelier</text><g transform="translate(1417 276) scale(0.9)"><path d="M0 0H25V44H0ZM8 7H17M10 36H15" fill="none" stroke="#62E4DA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="1340" cy="504" r="50" fill="#211B38" stroke="#B99BFF" stroke-width="2"/><text x="1263" y="580" fill="#F5F1FF" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Game Atelier</text><g transform="translate(1327 482) scale(0.9)"><path d="M-6 14Q-11 14 -14 24L-18 38Q-18 46 -10 43L0 35H25L35 43Q43 46 43 38L39 24Q36 14 31 14ZM-3 21V33M-9 27H3M26 24H26.1M32 30H32.1" fill="none" stroke="#B99BFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="940" cy="504" r="50" fill="#211B38" stroke="#62E4DA" s