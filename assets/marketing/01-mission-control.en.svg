<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Mission Control</title><desc id="desc">A composed command centre turns an unclear request into a visible plan. Specialists have a purpose, the owner sees decisions, and progress is tied to evidence.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#0C1822" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#F1F8F5" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">01 / DIRECTION STUDY</text><path d="M64 82L1536 82" fill="none" stroke="#86A3A4" stroke-width="0.65"/><text x="64" y="151" fill="#6DF1BE" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Mission Control</text><text x="61" y="229" fill="#F1F8F5" font-size="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">One brief. A team</text><text x="61" y="290" fill="#F1F8F5" font-size="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">with a clear mission.</text><text x="64" y="450" fill="#86A3A4" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">A composed command centre turns an unclear request</text><text x="64" y="478" fill="#86A3A4" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">into a visible plan.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#0C1822" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Your brief → your team</text><rect x="790" y="152" width="742" height="430" rx="20" fill="#142732" stroke="none" stroke-width="1"/><text x="820" y="192" fill="#86A3A4" font-size="14" font-fami