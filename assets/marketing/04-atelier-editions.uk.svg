<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Видання майстерні</title><desc id="desc">Редакційне портфоліо представляє систему через продумані розділи проєктів. Враження преміальної творчої та інженерної практики з конкретними результатами.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#EEE7DB" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#3C2028" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#8B7975" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">04 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#8B7975" stroke-width="0.65"/><text x="64" y="151" fill="#8A2947" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Видання майстерні</text><text x="61" y="229" fill="#3C2028" font-size="52" font-family="DejaVu Serif, Georgia, serif" font-weight="400">Ґрунтовна робота під</text><text x="61" y="290" fill="#3C2028" font-size="52" font-family="DejaVu Serif, Georgia, serif" font-weight="400">твій проєкт.</text><text x="64" y="450" fill="#8B7975" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Редакційне портфоліо представляє систему через</text><text x="64" y="478" fill="#8B7975" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">продумані розділи проєктів.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#8A2947" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#EEE7DB" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><text x="795" y="193" fill="#8A2947" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="3">FIELD NOTES / 001</text><path d="M795 213L1520 213" fill="none" stroke="#8A2947" stroke-width="1"/><rect x="795" y="245" width="308" height="300" rx="0" fill="#F8F4ED" stroke="none" stroke-width="1"/><text x="815" y="291" fill="#8A2947" font-size="38" font-family="DejaVu Serif, Georgia, serif" font-weight="400">I</text><text x="815" y="348.0" fill="#3C2028" font-size="32" font-family="DejaVu Serif, Georgia, serif" font-weight="400">Бриф стає</text><text x="815" y="391.2" fill="#3C2028" font-size="32" font-family="DejaVu Serif, Georgia, serif" font-weight="400">робочим</text><text x="815" y="434.4" fill="#3C2028" font-size="32" font-family="DejaVu Serif, Georgia, serif" font-weight="400">планом.</text><rect x="1130" y="245" width="390" height="300" rx="0" fill="#8A2947" stroke="none" stroke-width="1"/><text x="1153" y="284" fill="#EEE7DB" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">ЗРАЗОК ПРОЄКТУ</text><rect x="1168" y="305" width="147" height="208" rx="12" fill="#8A2947" stroke="none" stroke-width="1"/><rect x="1219.45" y="320" width="44.1" height="178" rx="12" fill="#8A2947" stroke="#EEE7DB" stroke-width="2"/><rect x="1227.45" y="335" width="28.1" height="17" rx="4" fill="#EEE7DB" stroke="none" stroke-width="1"/><rect x="1227.45" y="362" width="28.1" height="10" rx="3" fill="#B98C47" stroke="none" stroke-width="1"/><rect x="1227.45" y="381" width="28.1" height="10" rx="3" fill="#B98C47" stroke="none" stroke-width="1"/><rect x="1227.45" y="400" width="28.1" height="10" rx="3" fill="#B98C47" stroke="none" stroke-width="1"/><rect x="1332" y="305" width="165" height="208" rx="12" fill="#8A2947" stroke="none" stroke-width="1"/><text x="1350" y="333" fill="#B98C47" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">API / SERVICE</text><text x="1351" y="363" fill="#EEE7DB" font-size="13" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">GET</text><text x="1404" y="363" fill="#EEE7DB" font-size="13" font-f