<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Центр керування</title><desc id="desc">Зібраний центр керування перетворює нечіткий запит на видимий план. Кожен фахівець має роль, власник бачить рішення, а прогрес спирається на докази.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#0C1822" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#F1F8F5" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">01 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#86A3A4" stroke-width="0.65"/><text x="64" y="151" fill="#6DF1BE" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Центр керування</text><text x="61" y="229" fill="#F1F8F5" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Одна задача.</text><text x="61" y="290" fill="#F1F8F5" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Команда з чіткою</text><text x="61" y="351" fill="#F1F8F5" font-size="52" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">метою.</text><text x="64" y="450" fill="#86A3A4" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Зібраний центр керування перетворює нечіткий запит на</text><text x="64" y="478" fill="#86A3A4" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">видимий план.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#0C1822" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><rect x="790" y="152" width="742" height="430" rx="20" fill="#142732" stroke="none" stroke-width="1"/><text x="820" y="192" fill="#86A3A4" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">ПРОЄКТ / ПОТОЧНА ЗАДАЧА</text><text x="820" y="238" fill="#F1F8F5" font-size="26" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Відновити складний продукт</text><rect x="820" y="261" width="432" height="38" rx="5" fill="#0C1822" stroke="none" stroke-width="1"/><text x="836" y="286" fill="#6DF1BE" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">WORK  ↔  CODEX  /  checkpoint</text><rect x="820" y="325" width="455" height="39" rx="7" fill="#0C1822" stroke="none" stroke-width="1"/><circle cx="839" cy="344" r="4" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="855" y="350" fill="#F1F8F5" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Дослідження</text><text x="1110" y="350" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">призначено</text><rect x="820" y="376" width="455" height="39" rx="7" fill="#0C1822" stroke="none" stroke-width="1"/><circle cx="839" cy="395" r="4" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="855" y="401" fill="#F1F8F5" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Проєктування</text><text x="1110" y="401" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">призначено</text><rect x="820" y="427" width="455" height="39" rx="7" fill="#0C1822" stroke="none" stroke-width="1"/><circle cx="839" cy="446" r="4" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="855" y="452" fill="#F1F8F5" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Розробка</text><text x="1110" y="452" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">призначено</text><rect x="820" y="478" width="455" height="39" rx="7" fill="#0C1822" stroke="none" stroke-width="1"/><circle cx="839" cy="497" r="4" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="855" y="503" fill="#F1F8F5" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Перевірка</text><text x="1110" y="503" fill="#86A3A4" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">призначено</text><rect x="1297" y="261" width="201" height="232" rx="9" fill="#0C1822" stroke="none" stroke-width="1"/><text x="1315" y="291" fill="#F1B777" font-size="11" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">РІШЕННЯ ВЛАСНИКА</text><text x="1315" y="327.0" fill="#F1F8F5" font-size="21" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Обрати</text><text x="1315" y="355.35" fill="#F1F8F5" font-size="21" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">наступний</text><text x="1315" y="383.7" fill="#F1F8F5" font-size="21" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">етап</text><rect x="1315" y="407" width="162" height="43" rx="6" fill="#6DF1BE" stroke="none" stroke-width="1"/><text x="1330" y="435" fill="#0C1822" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Узгодити обсяг</text><path d="M64 638L1536 638" fill="none" stroke="#86A3A4" stroke-width="0.65"/><text x="64" y="677" fill="#6DF1BE" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">ШЛЯХ / один проєкт, спільний контекст</text><text x="64" y="727" fill="#6DF1BE" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">01</text><text x="104" y="729" fill="#F1F8F5" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Бриф</text><path d="M104 749L382 749" fill="none" stroke="#86A3A4" stroke-width="1"/><text x="393" y="734" fill="#6DF1BE" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="436" y="727" fill="#6DF1BE" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">02</text><text x="476" y="729" fill="#F1F8F5" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Команда фахівців</text><path d="M476 749L754 749" fill="none" stroke="#86A3A4" stroke-width="1"/><text x="765" y="734" fill="#6DF1BE" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="808" y="727" fill="#6DF1BE" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">03</text><text x="848" y="729" fill="#F1F8F5" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Розробка + перевірка</text><path d="M848 749L1126 749" fill="none" stroke="#86A3A4" stroke-width="1"/><text x="1137" y="734" fill="#6DF1BE" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="1180" y="727" fill="#6DF1BE" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">04</text><text x="1220" y="729" fill="#F1F8F5" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Продовження + розвиток</text><path d="M1220 749L1498 749" fill="none" stroke="#86A3A4" stroke-width="1"/><path d="M64 782L1536 782" fill="none" stroke="#86A3A4" stroke-width="0.65"/><text x="64" y="820" fill="#6DF1BE" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">ТОЙ САМИЙ ПІДХІД, РІЗНІ ЗАДАЧІ</text><g transform="translate(76 851) scale(0.8)"><path d="M0 12L-10 22L0 32M24 12L34 22L24 32M17 5L7 39" fill="none" stroke="#6DF1BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="918" fill="#F1F8F5" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Архітектура бекенду</text><g transform="translate(323 851) scale(0.8)"><path d="M-8 7H8V23H-8ZM22 28H38V44H22ZM8 15H30V28M-8 36H8M0 28V44" fill="none" stroke="#6DF1BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round