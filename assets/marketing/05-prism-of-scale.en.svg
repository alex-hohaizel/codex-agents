<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Prism of Scale</title><desc id="desc">A crisp modular prism expands from one bounded task to a complete product. It makes flexible scope tangible without pretending every project needs the largest team.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FBFAF7" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#777388" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">05 / DIRECTION STUDY</text><path d="M64 82L1536 82" fill="none" stroke="#777388" stroke-width="0.65"/><text x="64" y="151" fill="#6F48E9" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Prism of Scale</text><text x="61" y="229" fill="#191725" font-size="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">One method. The</text><text x="61" y="290" fill="#191725" font-size="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">scale your work</text><text x="61" y="351" fill="#191725" font-size="55" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">needs.</text><text x="64" y="450" fill="#777388" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">A crisp modular prism expands from one bounded task to</text><text x="64" y="478" fill="#777388" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">a complete product.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#6F48E9" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#FBFAF7" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Your brief → your team</text><path d="M820 403l28 -22h170v110l-28 22z" fill="#6F48E9" stroke="#191725" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="403" width="170" height="110" rx="0" fill="#F0EEF5" stroke="#191725" stroke-width="1"/><path d="M990 403L1018 381" fill="none" stroke="#191725" stroke-width="1"/><text x="836" y="489" fill="#191725" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">One task</text><text x="836" y="446" fill="#6F48E9" font-size="22" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">01</text><rect x="836" y="457" width="138" height="12" rx="2" fill="#6F48E9" stroke="none" stroke-width="1"/><path d="M1030 305l28 -22h195v208l-28 22z" fill="#9477EA" stroke="#191725" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="1030" y="305" width="195" height="208" rx="0" fill="#F0EEF5" stroke="#191725" stroke-width="1"/><path d="M1225 305L1253 283" fill="none" stroke="#191725" stroke-width="1"/><text x="1046" y="489" fill="#191725" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">One service</text><text x="1046" y="348" fill="#9477EA" font-size="22" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">02</text><rect x="1046" y="359" width="163" height="12" rx="2" fill="#9477EA" stroke="none" stroke-width="1"/><rect x="1046" y="394" width="163" height="12" rx="2" fill="#9477EA" stroke="none" stroke-width="1"/><path d="M1265 190l28 -22h220v323l-28 22z" fill="#F37345" stroke="#191725" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="1265" y="190" width="220" height="323" rx="0" fill="#F0EEF5" stroke="#191725" stroke-width="1"/><path d="M1485 190L1513 168" fill="none" stroke="#191725" stroke-width="1"/><text x="1281" y="489" fill="#191725" font-size="17" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">A whole product</text><text x="1281" y="233" fill="#F37345" font-size="22" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">03</text><rect x="1281" y="244" width="188" height="12" rx="2" fill="#F37345" stroke="none" stroke-width="1"/><rect x="1281" y="279" width="188" height="12" rx="2" fill="#F37345" stroke="none" stroke-width="1"/><rect x="1281" y="314" width="188" height="12" rx="2" fill="#F37345" stroke="none" stroke-width="1"/><text x="822" y="567" fill="#191725" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Scope is a choice. Expertise follows.</text><path d="M64 638L1536 638" fill="none" stroke="#777388" stroke-width="0.65"/><text x="64" y="677" fill="#6F48E9" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">THE PATH / one project, shared context</text><text x="64" y="727" fill="#6F48E9" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">01</text><text x="104" y="729" fill="#191725" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Brief</text><path d="M104 749L382 749" fill="none" stroke="#777388" stroke-width="1"/><text x="393" y="734" fill="#6F48E9" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="436" y="727" fill="#6F48E9" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">02</text><text x="476" y="729" fill="#191725" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Specialist team</text><path d="M476 749L754 749" fill="none" stroke="#777388" stroke-width="1"/><text x="765" y="734" fill="#6F48E9" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="808" y="727" fill="#6F48E9" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">03</text><text x="848" y="729" fill="#191725" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Build + review</text><path d="M848 749L1126 749" fill="none" stroke="#777388" stroke-width="1"/><text x="1137" y="734" fill="#6F48E9" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="1180" y="727" fill="#6F48E9" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">04</text><text x="1220" y="729" fill="#191725" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Continue + evolve</text><path d="M1220 749L1498 749" fill="none" stroke="#777388" stroke-width="1"/><path d="M64 782L1536 782" fill="none" stroke="#777388" stroke-width="0.65"/><text x="64" y="820" fill="#6F48E9" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">THE SAME METHOD, DIFFERENT WORK</text><g transform="translate(76 851) scale(0.8)"><path d="M0 12L-10 22L0 32M24 12L34 22L24 32M17 5L7 39" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Backend architecture</text><g transform="translate(323 851) scale(0.8)"><path d="M-8 7H8V23H-8ZM22 28H38V44H22ZM8 15H30V28M-8 36H8M0 28V44" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="311" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Integrations</text><g transform="translate(570 851) scale(0.8)"><path d="M-8 4H38V39H-8ZM-8 14H38M-1 9H0M5 9H6M11 9H12M0 22H29M0 29H17" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="558" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Websites</text><g transform="translate(817 851) scale(0.8)"><path d="M0 0H25V44H0ZM8 7H17M10 36H15" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="805" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Mobile apps</text><g transform="translate(1064 851) scale(0.8)"><path d="M-5 12H31V38H-5ZM13 12V3M8 3H18M3 23H4M22 23H23M6 32H20" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1052" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Chatbots</text><g transform="translate(1311 851) scale(0.8)"><path d="M-6 14Q-11 14 -14 24L-18 38Q-18 46 -10 43L0 35H25L35 43Q43 46 43 38L39 24Q36 14 31 14ZM-3 21V33M-9 27H3M26 24H26.1M32 30H32.1" fill="none" stroke="#6F48E9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1299" y="918" fill="#191725" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Mobile games</text><text x="64" y="969" fill="#777388" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">CONCEPT ONLY · Illustrative interfaces · No deployment or performance claim</text><text x="1362" y="969" fill="#191725" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">codex-agents</text></svg>