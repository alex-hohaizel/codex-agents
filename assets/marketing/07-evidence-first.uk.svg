<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc"><title id="title">Спочатку докази</title><desc id="desc">Стримана ідентичність навколо якості показує шлях від запиту користувача до перевіреного результату. Перевірка й приймання — частина роботи, а невирішені стани видимі.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#171918" stroke="none" stroke-width="1"/><text x="64" y="59" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="2">AGENT SYSTEM / 5.0.0</text><text x="1175" y="59" fill="#A3AAA0" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">07 / ЕСКІЗ НАПРЯМУ</text><path d="M64 82L1536 82" fill="none" stroke="#A3AAA0" stroke-width="0.65"/><text x="64" y="151" fill="#D6F577" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">Спочатку докази</text><text x="61" y="229" fill="#F6F7F1" font-size="52" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">Чітка відповідь:</text><text x="61" y="290" fill="#F6F7F1" font-size="52" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">звідки знаємо, що</text><text x="61" y="351" fill="#F6F7F1" font-size="52" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">працює?</text><text x="64" y="450" fill="#A3AAA0" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Стримана ідентичність навколо якості показує шлях від</text><text x="64" y="478" fill="#A3AAA0" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">запиту користувача до перевіреного результату.</text><rect x="64" y="555" width="340" height="43" rx="5" fill="#D6F577" stroke="none" stroke-width="1"/><text x="82" y="583" fill="#171918" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Твоя задача → твоя команда</text><rect x="790" y="155" width="740" height="422" rx="8" fill="#262C26" stroke="none" stroke-width="1"/><text x="815" y="193" fill="#D6F577" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">ІЛЮСТРАЦІЯ ШЛЯХУ ВИМОГИ</text><text x="815" y="240" fill="#A3AAA0" font-size="14" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">ЗАПИТ</text><text x="982" y="240" fill="#A3AAA0" font-size="14" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">ДОКАЗ</text><text x="1246" y="240" fill="#A3AAA0" font-size="14" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">СТАН</text><path d="M815 263L1505 263" fill="none" stroke="#A3AAA0" stroke-width="0.7"/><text x="815" y="295" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">REQ-01</text><text x="982" y="295" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Контракт пов’язано</text><text x="1246" y="295" fill="#D6F577" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">СПРОЄКТОВАНО</text><path d="M815 345L1505 345" fill="none" stroke="#A3AAA0" stroke-width="0.7"/><text x="815" y="377" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">REQ-02</text><text x="982" y="377" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Звіт перевірки</text><text x="1246" y="377" fill="#D6F577" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">ПЕРЕВІРЕНО</text><path d="M815 427L1505 427" fill="none" stroke="#A3AAA0" stroke-width="0.7"/><text x="815" y="459" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="700">REQ-03</text><text x="982" y="459" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">Відповідь власника</text><text x="1246" y="459" fill="#F0B279" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">ОЧІКУЄ</text><text x="815" y="548" fill="#F6F7F1" font-size="18" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">«Готово» має перевірний зміст.</text><path d="M64 638L1536 638" fill="none" stroke="#A3AAA0" stroke-width="0.65"/><text x="64" y="677" fill="#D6F577" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">ШЛЯХ / один проєкт, спільний контекст</text><text x="64" y="727" fill="#D6F577" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">01</text><text x="104" y="729" fill="#F6F7F1" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Бриф</text><path d="M104 749L382 749" fill="none" stroke="#A3AAA0" stroke-width="1"/><text x="393" y="734" fill="#D6F577" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="436" y="727" fill="#D6F577" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">02</text><text x="476" y="729" fill="#F6F7F1" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Команда фахівців</text><path d="M476 749L754 749" fill="none" stroke="#A3AAA0" stroke-width="1"/><text x="765" y="734" fill="#D6F577" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="808" y="727" fill="#D6F577" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">03</text><text x="848" y="729" fill="#F6F7F1" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Розробка + перевірка</text><path d="M848 749L1126 749" fill="none" stroke="#A3AAA0" stroke-width="1"/><text x="1137" y="734" fill="#D6F577" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">→</text><text x="1180" y="727" fill="#D6F577" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">04</text><text x="1220" y="729" fill="#F6F7F1" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Продовження + розвиток</text><path d="M1220 749L1498 749" fill="none" stroke="#A3AAA0" stroke-width="1"/><path d="M64 782L1536 782" fill="none" stroke="#A3AAA0" stroke-width="0.65"/><text x="64" y="820" fill="#D6F577" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="1">ТОЙ САМИЙ ПІДХІД, РІЗНІ ЗАДАЧІ</text><g transform="translate(76 851) scale(0.8)"><path d="M0 12L-10 22L0 32M24 12L34 22L24 32M17 5L7 39" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Архітектура бекенду</text><g transform="translate(323 851) scale(0.8)"><path d="M-8 7H8V23H-8ZM22 28H38V44H22ZM8 15H30V28M-8 36H8M0 28V44" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="311" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Інтеграції</text><g transform="translate(570 851) scale(0.8)"><path d="M-8 4H38V39H-8ZM-8 14H38M-1 9H0M5 9H6M11 9H12M0 22H29M0 29H17" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="558" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Вебсайти</text><g transform="translate(817 851) scale(0.8)"><path d="M0 0H25V44H0ZM8 7H17M10 36H15" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="805" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Мобільні застосунки</text><g transform="translate(1064 851) scale(0.8)"><path d="M-5 12H31V38H-5ZM13 12V3M8 3H18M3 23H4M22 23H23M6 32H20" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1052" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Чатботи</text><g transform="translate(1311 851) scale(0.8)"><path d="M-6 14Q-11 14 -14 24L-18 38Q-18 46 -10 43L0 35H25L35 43Q43 46 43 38L39 24Q36 14 31 14ZM-3 21V33M-9 27H3M26 24H26.1M32 30H32.1" fill="none" stroke="#D6F577" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1299" y="918" fill="#F6F7F1" font-size="15" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">Мобільні ігри</text><text x="64" y="969" fill="#A3AAA0" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" font-weight="400">ЛИШЕ КОНЦЕПЦІЯ · Ілюстративні інтерфейси · Без заяв про випуск чи показники</text><text x="1362" y="969" fill="#F6F7F1" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">codex-agents</text></svg>