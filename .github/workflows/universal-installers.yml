name: Build and accept universal installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native:
    name: Native ready package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, cpu: x64}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, cpu: arm64}
          - {target: darwin-arm64, runner: macos-15, cpu: arm64}
          - {target: darwin-x64, runner: macos-15-intel, cpu: x64}
          - {target: win32-x64, runner: windows-2025, cpu: x64}
          - {target: win32-arm64, runner: windows-11-arm, cpu: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.cpu }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          architecture: ${{ matrix.cpu }}
          cache: npm
          cache-dependency-path: apps/agent-atelier/package-lock.json
      - name: Compile the current complete client without changing source
        run: |
          import importlib.util, pathlib, subprocess
          path = pathlib.Path('scripts/native_installer_ci.py')
          spec = importlib.util.spec_from_file_location('native_ci_build', path)
          ci = importlib.util.module_from_spec(spec); spec.loader.exec_module(ci)
          npm = ci.npm_command()
          subprocess.run([*npm, 'ci', '--ignore-scripts'], cwd='apps/agent-atelier', check=True)
          subprocess.run([*npm, 'run', 'build', '--', '--manifest'], cwd='apps/agent-atelier', check=True)
      - name: Build pinned actual native vendor runtimes
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('native-installer-' + os.environ['NATIVE_TARGET'])
          command = [sys.executable, '-B', 'scripts/runtime_bundle.py', '--target', os.environ['NATIVE_TARGET'],
                     '--cache', str(work / 'vendor-cache'), '--output', str(work / 'runtime')]
          if sys.platform == 'linux': command.append('--verify-node-signature')
          subprocess.run(command, check=True)
      - name: Build a ready ZIP from this clean exact commit
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('native-installer-' + os.environ['NATIVE_TARGET'])
          subprocess.run([sys.executable, '-B', 'scripts/build_installer.py', '--output', str(work / 'ready'),
                          '--runtime-bundle', str(work / 'runtime' / ('runtime-' + os.environ['NATIVE_TARGET'] + '.zip'))], check=True)
      - name: Prepare separate pinned Codex and real browser test tooling
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('native-installer-' + os.environ['NATIVE_TARGET'])
          subprocess.run([sys.executable, '-B', 'scripts/native_installer_ci.py', 'tools', '--output', str(work / 'test-tools')], check=True)
      - name: Accept the actual received ZIP through buyer and rendered browser flows
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import json, os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('native-installer-' + os.environ['NATIVE_TARGET'])
          archives = list((work / 'ready').glob('Agent-System-*.zip'))
          if len(archives) != 1: raise SystemExit('Expected one exact ready archive')
          tools = json.loads((work / 'test-tools/TOOLS.json').read_text(encoding='utf8'))
          subprocess.run([sys.executable, '-B', 'scripts/native_installer_ci.py', 'check', '--archive', str(archives[0]),
                          '--output', str(work / 'acceptance'), '--codex', tools['codex'], '--browser', tools['browser']], check=True)
      - name: Retain only redacted evidence and page screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-native-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/native-installer-${{ matrix.target }}/acceptance/public-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain accepted native ready ZIP and its exact runtime input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-runtime-input-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-installer-${{ matrix.target }}/ready/*.zip
            ${{ runner.temp }}/native-installer-${{ matrix.target }}/ready/*.build.json
            ${{ runner.temp }}/native-installer-${{ matrix.target }}/runtime/runtime-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble all seven exact-commit installers
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: apps/agent-atelier/package-lock.json
      - name: Read all six accepted platform artifacts from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-runtime-input-*
          path: ${{ runner.temp }}/installer-inputs
      - name: Compile the same client and compose Universal from the six existing runtime inputs
        run: |
          import importlib.util, os, pathlib, subprocess, sys
          path = pathlib.Path('scripts/native_installer_ci.py')
          spec = importlib.util.spec_from_file_location('native_ci_aggregate', path)
          ci = importlib.util.module_from_spec(spec); spec.loader.exec_module(ci)
          npm = ci.npm_command()
          subprocess.run([*npm, 'ci', '--ignore-scripts'], cwd='apps/agent-atelier', check=True)
          subprocess.run([*npm, 'run', 'build', '--', '--manifest'], cwd='apps/agent-atelier', check=True)
          inputs = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installer-inputs'
          runtimes = sorted(inputs.rglob('runtime-*.zip'))
          if len(runtimes) != 6: raise SystemExit('Expected the six already accepted runtime archives')
          command = [sys.executable, '-B', 'scripts/build_installer.py', '--output', str(inputs / 'universal')]
          for runtime in runtimes: command += ['--runtime-bundle', str(runtime)]
          subprocess.run(command, check=True)
          subprocess.run([sys.executable, '-B', 'scripts/installer_index.py', '--artifacts-dir', str(inputs),
                          '--output', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'installer-release'), '--require-all'], check=True)
      - name: Build ready Solo and Team candidates through the same complete portable assembly
        run: |
          import json, os, pathlib, subprocess, sys, zipfile
          inputs = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installer-inputs'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'commercial-ready'
          command = [sys.executable, '-B', 'scripts/build_commercial.py', '--output', str(output)]
          for runtime in sorted(inputs.rglob('runtime-*.zip')): command += ['--portable-runtime-bundle', str(runtime)]
          subprocess.run(command, check=True)
          def manifest(path):
              with zipfile.ZipFile(path) as archive:
                  names = [name for name in archive.namelist() if name.count('/') == 1 and name.endswith('/product-manifest.json')]
                  if len(names) != 1: raise SystemExit('Expected one complete product manifest')
                  return json.loads(archive.read(names[0]))
          neutral = manifest(next((inputs / 'universal').glob('*-Universal.zip')))
          catalog = json.loads((output / 'BUILD.json').read_text(encoding='utf8'))
          if {row['edition'] for row in catalog['files']} != {'solo','team'}:
              raise SystemExit('Both ready commercial editions are required')
          for row in catalog['files']:
              paid = manifest(output / row['name'])
              if (paid['source_commit'] != os.environ['GITHUB_SHA'] or paid['source_clean'] is not True
                  or paid['edition'] != row['edition'] or paid['files'] != neutral['files']
                  or paid['portable_runtimes'] != neutral['portable_runtimes']):
                  raise SystemExit('Commercial editions lost the identical accepted technical payload')
          (output / 'PAYLOAD-EQUIVALENCE.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'], 'status': 'identical-inventoried-payloads',
              'scope': 'All source/runtime/GUI/resource file hashes and native platform mappings match Universal. Edition manifests and separate trusted delivery remain distinct; this is not independent native execution of paid ZIP bytes.',
              'sales_launched': False}, indent=2) + '\n', encoding='utf8')
      - name: Retain ready commercial candidates without publishing or issuing a purchase
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commercial-ready-candidate
          path: ${{ runner.temp }}/commercial-ready/
          if-no-files-found: error
          retention-days: 7
      - name: Retain all seven candidate ZIPs and the separate installer build index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-release-candidate
          path: ${{ runner.temp }}/installer-release/
          if-no-files-found: error
          retention-days: 14
      - name: Retain the exact Universal ZIP for the second six native acceptance jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-universal-input
          path: ${{ runner.temp }}/installer-release/*-Universal.zip
          if-no-files-found: error
          retention-days: 14

  universal:
    name: Universal exact ZIP acceptance (${{ matrix.target }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04, cpu: x64}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, cpu: arm64}
          - {target: darwin-arm64, runner: macos-15, cpu: arm64}
          - {target: darwin-x64, runner: macos-15-intel, cpu: x64}
          - {target: win32-x64, runner: windows-2025, cpu: x64}
          - {target: win32-arm64, runner: windows-11-arm, cpu: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.cpu }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          architecture: ${{ matrix.cpu }}
      - name: Read the exact assembled Universal ZIP from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-universal-input
          path: ${{ runner.temp }}/universal-input
      - name: Prepare separate pinned Codex and actual browser tooling
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('universal-acceptance-' + os.environ['NATIVE_TARGET'])
          subprocess.run([sys.executable, '-B', 'scripts/native_installer_ci.py', 'tools', '--output', str(work / 'test-tools')], check=True)
      - name: Accept these exact Universal bytes through native buyer and real browser flows
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          import json, os, pathlib, subprocess, sys
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('universal-acceptance-' + os.environ['NATIVE_TARGET'])
          archives = list((pathlib.Path(os.environ['RUNNER_TEMP']) / 'universal-input').glob('*-Universal.zip'))
          if len(archives) != 1: raise SystemExit('Expected the single exact Universal input')
          tools = json.loads((work / 'test-tools/TOOLS.json').read_text(encoding='utf8'))
          subprocess.run([sys.executable, '-B', 'scripts/native_installer_ci.py', 'check', '--archive', str(archives[0]),
                          '--output', str(work / 'acceptance'), '--codex', tools['codex'], '--browser', tools['browser']], check=True)
      - name: Retain only redacted Universal acceptance evidence and page screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-universal-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/universal-acceptance-${{ matrix.target }}/acceptance/public-proof/
          if-no-files-found: warn
          retention-days: 14

  accepted-installer-provenance:
    name: Attest accepted exact-main installer subjects
    needs: [assemble, universal]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'alex-hohaizel/codex-agents'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: python {0}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-release-candidate
          path: ${{ runner.temp }}/accepted-installers
      - name: Read all twelve archive-bound native and browser receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*-proof-*
          path: ${{ runner.temp }}/accepted-installer-proofs
      - name: Check the seven exact subjects and clean current source before attestation
        id: subjects
        run: |
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'accepted-installers'
          record = json.loads((root / 'INSTALLER-BUILD.json').read_text(encoding='utf8'))
          if record['schema'] != 'codex-agents.installer-release/1' or not record['source_clean'] or record['source_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Installer index does not match this clean exact main commit')
          if len(record['files']) != 7: raise SystemExit('All seven accepted installer subjects are required')
          subjects = []
          for row in record['files']:
              name = row['name']; file = root / name
              if pathlib.Path(name).name != name or file.is_symlink() or file.stat().st_size != row['size']:
                  raise SystemExit('Installer subject size or path differs')
              with file.open('rb') as stream:
                  if hashlib.file_digest(stream, 'sha256').hexdigest() != row['sha256']:
                      raise SystemExit('Installer subject digest differs')
              subjects.append(file)
          expected_proofs = {(row['sha256'], target) for row in record['files'] for target in row['platforms']}
          observed_proofs = set()
          receipts = list((pathlib.Path(os.environ['RUNNER_TEMP']) / 'accepted-installer-proofs').rglob('NATIVE-CI.json'))
          if len(receipts) != 12: raise SystemExit('All twelve native and rendered-browser receipts are required')
          for path in receipts:
              proof = json.loads(path.read_text(encoding='utf8'))
              if proof['status'] != 'passed' or proof['source_commit'] != os.environ['GITHUB_SHA'] or proof['backend_and_real_browser'] is not True:
                  raise SystemExit('A native acceptance receipt is not passed or belongs to another source')
              if proof['target'].startswith('win32-') and proof.get('windows_restricted_non_admin_verified') is not True:
                  raise SystemExit('Windows archive lacks actual restricted non-admin execution proof')
              pair = (proof['archive_sha256'], proof['target'])
              if pair in observed_proofs: raise SystemExit('Duplicate native archive/target evidence')
              observed_proofs.add(pair)
          if observed_proofs != expected_proofs:
              raise SystemExit('Native evidence does not cover the seven exact archive subjects and all six Universal targets')
          subjects += [root / 'INSTALLER-BUILD.json', root / 'INSTALLER-SHA256SUMS']
          if {path.name for path in root.iterdir()} != {path.name for path in subjects}:
              raise SystemExit('Unexpected installer release subjects')
          proof_root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'accepted-installer-proofs'
          evidence = root / 'NATIVE-ACCEPTANCE.zip'
          with zipfile.ZipFile(evidence, 'x', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(proof_root.rglob('*')):
                  if file.is_file():
                      if file.is_symlink() or file.suffix not in ('.json', '.png'):
                          raise SystemExit('Unexpected native proof file')
                      info = zipfile.ZipInfo(file.relative_to(proof_root).as_posix(), (2026, 11, 18, 0, 0, 0))
                      info.create_system = 3; info.external_attr = 0o100644 << 16
                      archive.writestr(info, file.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with evidence.open('rb') as stream:
              evidence_sha = hashlib.file_digest(stream, 'sha256').hexdigest()
          evidence_sums = root / 'NATIVE-ACCEPTANCE-SHA256SUMS'
          evidence_sums.write_text(evidence_sha + '  NATIVE-ACCEPTANCE.zip\n', encoding='utf8')
          subjects += [evidence, evidence_sums]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as result:
              print('paths<<INSTALLER_SUBJECTS', file=result)
              for file in subjects: print(file, file=result)
              print('INSTALLER_SUBJECTS', file=result)
      - name: Attest exact archives and their separate installer build index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Retain accepted attested release subjects with durable native proof archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-accepted-release
          path: ${{ runner.temp }}/accepted-installers/
          if-no-files-found: error
          retention-days: 7

# This workflow creates downloadable technical artifacts and provenance. It
# does not publish a GitHub Release, issue an entitlement, start sales, change
# repository visibility, or copy a user's account HOME/session/authentication.
