<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent System — 10 visual directions</title><style>
:root{color-scheme:light;--bg:#f5f4f0;--ink:#212932;--muted:#727a80;--line:#d9dcd7;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:inherit}header{padding:30px 4vw 26px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center;justify-content:space-between}.brand{font-size:14px;letter-spacing:.12em;font-weight:800}.lang{display:flex;border:1px solid #a8afa8;border-radius:8px;padding:3px;gap:3px}.lang button{border:0;background:transparent;padding:9px 14px;border-radius:5px;font-size:13px}.lang .on{background:#212932;color:white}.intro{padding:50px 4vw 36px;max-width:1270px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}h1{font-size:clamp(32px,4.5vw,66px);line-height:1.08;letter-spacing:-.045em;max-width:1000px;margin:15px 0 20px}.intro p{font-size:18px;line-height:1.6;color:#5a646a;max-width:900px}.note{padding:14px 18px;background:#e8ece4;border-radius:8px;font-size:14px!important}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:28px;padding:0 4vw 65px}.sidebar{position:sticky;top:20px;align-self:start}.concept-button{width:100%;display:grid;grid-template-columns:36px 1fr;gap:7px;text-align:left;background:transparent;border:1px solid transparent;padding:14px 12px;border-radius:8px;color:var(--ink)}.concept-button:hover{background:#e9ebe5}.concept-button.active{background:white;border-color:#abb6a9;box-shadow:0 4px 16px #00000005}.num{color:#7b8781;font-size:12px;font-weight:700;padding-top:3px}.name{font-size:15px;font-weight:700}.swatches{display:flex;gap:5px;margin-top:7px}.swatches i{width:17px;height:5px;border-radius:1px}.viewer{min-width:0}#board{border-radius:12px;overflow:hidden;box-shadow:0 12px 44px #111a2220;background:white}#board svg{display:block;width:100%;height:auto}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:17px 0 28px}.toolbar p{font-size:12px;color:#6b7479;margin:0}.actions{display:flex;gap:8px}.actions button{border:1px solid #bdc5bc;border-radius:6px;padding:9px 12px;background:transparent;font-size:12px}.actions .primary{background:#25352d;color:white;border-color:#25352d}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail{background:#fff;border:1px solid #e0e3dc;border-radius:10px;padding:24px}.detail h2{font-size:14px;margin:0 0 12px}.detail p{font-size:14px;line-height:1.65;color:#5c6669;margin:0}.detail.wide{grid-column:1/-1}.palette{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.color{width:85px;font-size:10px;color:#667074}.color span{display:block;height:26px;border-radius:4px;margin-bottom:5px;border:1px solid #00000015}.footer{border-top:1px solid var(--line);padding:26px 4vw 40px;font-size:12px;line-height:1.6;color:var(--muted)}.comparison{margin-top:40px;background:#fff;border-radius:10px;border:1px solid #dfe3dc;padding:25px;overflow-x:auto}.comparison h2{font-size:18px;margin:0 0 20px}table{border-collapse:collapse;width:100%;font-size:12px;line-height:1.5}td,th{text-align:left;padding:12px;border-bottom:1px solid #e6e8e2;vertical-align:top}th{color:#6a756c;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.selected-note{display:flex;align-items:center;gap:8px;color:#6a756c;font-size:12px;margin:0 0 16px}.selected-note:before{content:'';width:7px;height:7px;border-radius:50%;background:#9da99a}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:8px;background:#25352d;color:#fff;font-size:13px;box-shadow:0 4px 20px #0003;display:none}button:focus-visible,a:focus-visible{outline:3px solid #4e79b9;outline-offset:3px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.concept-button{padding:9px}.details{grid-template-columns:1fr}.detail.wide{grid-column:auto}.intro{padding-top:32px}.toolbar{gap:15px}.toolbar p{width:100%}}@media(max-width:540px){header{padding:20px 5vw}.brand{font-size:11px}.intro{padding-inline:5vw}.intro p{font-size:16px}.layout{padding-inline:5vw}.concept-button .name{font-size:12px}.concept-button{grid-template-columns:26px 1fr}.actions{width:100%;flex-wrap:wrap}.detail{padding:20px}.toolbar p{line-height:1.6}}@media(prefers-reduced-motion:no-preference){#board{animation:reveal .24s ease-out}@keyframes reveal{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}@media print{header,.sidebar,.actions,.comparison{display:none}.layout{display:block;padding:0}.intro{padding:20px}#board{box-shadow:none;border-radius:0}.details{break-before:page}.detail{break-inside:avoid}}
</style></head><body><header><div class="brand">AGENT SYSTEM / 5.0.0<br><span style="font-weight:400;letter-spacing:.04em;font-size:11px">CODEX-AGENTS / VISUAL EXPLORATION</span></div><div class="lang" aria-label="Language"><button id="uk" onclick="setLang('uk')">Українська</button><button id="en" onclick="setLang('en')">English</button></div></header><section class="intro"><div id="eyebrow" class="eyebrow"></div><h1 id="headline"></h1><p id="intro"></p><p id="note" class="note"></p></section><main class="layout"><nav id="sidebar" class="sidebar" aria-label="Concepts"></nav><div class="viewer"><p class="selected-note" id="status"></p><div id="board"></div><div class="toolbar"><p id="hint"></p><div class="actions"><button id="prev" onclick="move(-1)"></button><button id="next" onclick="move(1)"></button><button id="download" onclick="downloadSvg()"></button><button class="primary" id="choose" onclick="copyChoice()"></button></div></div><section id="details" class="details"></section><section class="comparison"><h2 id="compareTitle"></h2><div id="compare"></div></section></div></main><footer class="footer" id="footer"></footer><div class="toast" role="status" id="toast"></div><script>
const concepts=[{"id": "01", "slug": "mission-control", "name": ["Mission Control", "Центр керування"], "tag": ["One brief. A team with a clear mission.", "Одна задача. Команда з чіткою метою."], "desc": ["A composed command centre turns an unclear request into a visible plan. Specialists have a purpose, the owner sees decisions, and progress is tied to evidence.", "Зібраний центр керування перетворює нечіткий запит на видимий план. Кожен фахівець має роль, власник бачить рішення, а прогрес спирається на докази."], "bg": "#0C1822", "fg": "#F1F8F5", "accent": "#6DF1BE", "muted": "#86A3A4", "card": "#142732", "secondary": "#F1B777", "font": "Arial, sans-serif", "form": "dashboard", "audience": ["Technical founders and engineering leads who want oversight without coordinating every role.", "Технічні засновники й керівники розробки, яким потрібен контроль без ручної координації кожної ролі."], "visual": ["A dark operational canvas; one brief at the centre, clearly named specialist lanes, compact evidence cards. Mint shows active work; amber marks an owner decision.", "Темне операційне полотно; одна задача в центрі, підписані доріжки фахівців, компактні картки доказів. М’ятний означає активну роботу; бурштиновий — рішення власника."], "story": ["Open on one plain-language brief. Reveal the director and four roles. Follow one requirement into implementation and verification. Finish with a shared WORK + CODEX checkpoint.", "Почати з одного запиту людською мовою. Показати директора й чотири ролі. Простежити вимогу до реалізації та перевірки. Завершити спільною контрольною точкою WORK + CODEX."], "motion": ["Cards enter in causal order; a single route line follows the active handoff. 12–18 seconds. Reduced-motion version uses discrete cuts.", "Картки з’являються в причинному порядку; одна лінія відстежує активну передачу. 12–18 секунд. Версія зі зменшеним рухом — послідовна зміна кадрів."], "lock": ["Preserve the navy/mint ratio, rectangular panels, left-aligned type, status vocabulary and one amber owner-decision signal. No decorative radar or fake live metrics.", "Зберегти співвідношення темно-синього й м’ятного, прямокутні панелі, ліве вирівнювання, словник станів та один бурштиновий сигнал рішення власника. Без декоративного радара й вигаданих live-метрик."]}, {"id": "02", "slug": "living-blueprint", "name": ["Living Blueprint", "Живе креслення"], "tag": ["Every decision leaves a useful trace.", "Кожне рішення залишає корисний слід."], "desc": ["A technical drawing that evolves into a working product. Requirements, architecture and tests remain visibly connected, from a single backend concern to a whole system.", "Технічне креслення, що розвивається в робочий продукт. Вимоги, архітектура й перевірки залишаються пов’язаними — від однієї проблеми бекенду до цілої системи."], "bg": "#F4F1E9", "fg": "#173451", "accent": "#245EEA", "muted": "#6D7B86", "card": "#FFFFFF", "secondary": "#D06A43", "font": "Georgia, serif", "form": "blueprint", "audience": ["Architects, backend leads and teams that need explicit contracts, trade-offs and continuity.", "Архітектори, бекенд-ліди й команди, яким потрібні точні контракти, обґрунтовані компроміси та безперервність."], "visual": ["Ivory drafting paper, cobalt construction lines, annotation numbers and restrained rust corrections. Product silhouettes grow out of the same measured grid.", "Креслярський папір кольору слонової кістки, кобальтові лінії, номери виносок і стримані теракотові уточнення. Силуети продуктів виростають із тієї самої розмірної сітки."], "story": ["Start with a requirement annotation. Unfold its data contract, design decision, implementation and test. Zoom out to show apps, games and integrations sharing the method.", "Почати з виноски вимоги. Розкрити її контракт даних, рішення, реалізацію та тест. Віддалити камеру й показати застосунки, ігри та інтеграції з тим самим підходом."], "motion": ["Lines draw once, annotations settle into place, then the blueprint becomes a product outline. Never imply that drawing alone produces tested software.", "Лінії прокреслюються один раз, виноски стають на місця, потім креслення переходить у контур продукту. Не створювати враження, що саме креслення вже є перевіреним ПЗ."], "lock": ["Keep the paper background, cobalt geometry, numbered annotations and serif headline with sans-serif technical captions.", "Зберегти паперове тло, кобальтову геометрію, нумеровані виноски та заголовок із засічками з технічними підписами без засічок."]}, {"id": "03", "slug": "product-constellation", "name": ["Product Constellation", "Сузір’я продукту"], "tag": ["The right expertise, connected around your goal.", "Потрібна експертиза навколо твоєї мети."], "desc": ["A purposeful constellation reveals how specialist families join around one project. The emphasis is collaboration across disciplines, with an obvious centre and readable relationships.", "Змістовне сузір’я показує, як спеціалізовані сімейства об’єднуються навколо одного проєкту. Акцент — на співпраці дисциплін із чітким центром і зрозумілими зв’язками."], "bg": "#121025", "fg": "#F5F1FF", "accent": "#B99BFF", "muted": "#A69ABC", "card": "#211B38", "secondary": "#62E4DA", "font": "Arial, sans-serif", "form": "constellation", "audience": ["Creators with multidisciplinary projects: an app, its support bot, integration services and launch materials.", "Автори міждисциплінарних проєктів: застосунок, бот підтримки, інтеграційні сервіси та матеріали запуску."], "visual": ["A deep-plum field, large labelled nodes and a deliberate five-cluster orbit. Connections express real handoffs; small stars are absent.", "Глибоке сливове поле, великі підписані вузли й продумана орбіта п’яти кластерів. Зв’язки означають реальні передачі; дрібних декоративних зірок немає."], "story": ["Place the owner’s goal at the centre. Activate only relevant families. Show one cross-family task and return its evidence to the project checkpoint.", "Розмістити мету власника в центрі. Активувати лише потрібні сімейства. Показати одну міжсімейну задачу й повернути докази до контрольної точки проєкту."], "motion": ["Orbit is a compositional metaphor, not perpetual motion. Nodes illuminate on demand; lines appear only when a handoff occurs.", "Орбіта — композиційна метафора без постійного обертання. Вузли активуються за потреби; лінії з’являються лише під час передачі."], "lock": ["Preserve central-goal hierarchy, five readable family clusters, plum/lilac/turquoise palette and meaningful labelled edges.", "Зберегти ієрархію центральної мети, п’ять читабельних кластерів, сливово-бузково-бірюзову палітру й змістовні підписані зв’язки."]}, {"id": "04", "slug": "atelier-editions", "name": ["Atelier Editions", "Видання майстерні"], "tag": ["A serious craft, shaped to your project.", "Ґрунтовна робота під твій проєкт."], "desc": ["An editorial portfolio presents the system through carefully composed project chapters. It feels like a premium creative and engineering practice with concrete deliverables.", "Редакційне портфоліо представляє систему через продумані розділи проєктів. Враження преміальної творчої та інженерної практики з конкретними результатами."], "bg": "#EEE7DB", "fg": "#3C2028", "accent": "#8A2947", "muted": "#8B7975", "card": "#F8F4ED", "secondary": "#B98C47", "font": "Georgia, serif", "form": "editorial", "audience": ["Independent creators, product owners and buyers who value coherent experience, design and documented work.", "Незалежні автори, власники продуктів і покупці, що цінують цілісний досвід, дизайн та задокументовану роботу."], "visual": ["Oversized editorial serif, burgundy folio numbers, generous paper margins and specimen-like product frames. Each chapter is an outcome.", "Велика редакційна антиква, бордові номери сторінок, щедрі паперові поля й продуктові рамки як зразки. Кожен розділ — результат."], "story": ["Turn the brief into chapter one. Move through research, visual identity, engineering, independent review and release preparation. End on a living project archive.", "Перетворити бриф на перший розділ. Пройти дослідження, візуальну ідентичність, інженерію, незалежну перевірку й підготовку випуску. Завершити живим архівом проєкту."], "motion": ["Page-like cuts and slow typographic reveals. Avoid simulated paper textures that obscure the actual interface or claims.", "Монтажні переходи як сторінки й повільне розкриття типографіки. Уникати текстур паперу, що заважають інтерфейсу або змісту."], "lock": ["Preserve burgundy/ivory, folio numbering, generous negative space, serif hierarchy and consistent project specimen frames.", "Зберегти бордово-кремову палітру, нумерацію, великий вільний простір, ієрархію антикви й однакові рамки зразків проєктів."]}, {"id": "05", "slug": "prism-of-scale", "name": ["Prism of Scale", "Призма масштабу"], "tag": ["One method. The scale your work needs.", "Один підхід. Масштаб твоєї задачі."], "desc": ["A crisp modular prism expands from one bounded task to a complete product. It makes flexible scope tangible without pretending every project needs the largest team.", "Чітка модульна призма розгортається від обмеженої задачі до цілого продукту. Гнучкий масштаб стає наочним без припущення, що кожному проєкту потрібна найбільша команда."], "bg": "#FBFAF7", "fg": "#191725", "accent": "#6F48E9", "muted": "#777388", "card": "#F0EEF5", "secondary": "#F37345", "font": "Arial, sans-serif", "form": "prism", "audience": ["People comparing a small focused assignment with a larger product initiative; useful for future packaging tiers without inventing prices.", "Люди, що порівнюють вузьку задачу з великим продуктовим задумом; підходить для майбутніх пакетів без вигадування цін."], "visual": ["Black oversized type, white space and violet/orange folded modules. Small, medium and large scopes share one visual construction grammar.", "Великий чорний шрифт, білий простір і фіолетово-помаранчеві складені модулі. Малий, середній і великий масштаби мають одну візуальну граматику."], "story": ["Isolate a backend decision. Expand it into a service, then an app with support and integrations. Show that scope is deliberately chosen before work expands.", "Виокремити рішення в бекенді. Розгорнути його в сервіс, потім у застосунок із підтримкою та інтеграціями. Показати свідомий вибір масштабу до розширення робіт."], "motion": ["Modules unfold along one axis, then lock into a stable composition. Every expansion is labelled as a scope decision.", "Модулі розкриваються вздовж однієї осі й фіксуються в стійкій композиції. Кожне розширення підписане як рішення про масштаб."], "lock": ["Keep fold angles, three scope levels, bold grotesk headings and violet/orange accents; preserve the small-task route in every adaptation.", "Зберегти кути складок, три масштаби, жирний гротеск і фіолетово-помаранчеві акценти; у кожній адаптації лишити маршрут малої задачі."]}, {"id": "06", "slug": "relay", "name": ["Relay", "Естафета"], "tag": ["Good work keeps its context at every handoff.", "Робота зберігає контекст на кожному переході."], "desc": ["The central story is continuity: WORK clarifies, CODEX implements, and both continue with recorded decisions and evidence. Handoffs are the hero.", "Центральна історія — безперервність: WORK уточнює, CODEX реалізує, обидва продовжують із зафіксованими рішеннями й доказами. Головний герой — передача контексту."], "bg": "#113ED9", "fg": "#FFFFFF", "accent": "#FFD270", "muted": "#B5C6FF", "card": "#224FE3", "secondary": "#FF877C", "font": "Arial, sans-serif", "form": "relay", "audience": ["Users who already switch between planning and coding tools and want a repeatable joint workflow.", "Користувачі, що вже перемикаються між плануванням і розробкою та хочуть повторювану спільну роботу."], "visual": ["Electric cobalt, warm yellow batons and a strong split-screen WORK/CODEX layout. The same project packet appears on both sides.", "Електричний кобальт, теплі жовті естафетні блоки та сильна композиція WORK/CODEX навпіл. Той самий пакет проєкту присутній з обох боків."], "story": ["Write one brief in WORK. Carry requirements, decisions and acceptance criteria into CODEX. Return code, checks and open questions. Continue without a fresh project.", "Написати один бриф у WORK. Передати вимоги, рішення та критерії приймання в CODEX. Повернути код, перевірки й відкриті питання. Продовжити той самий проєкт."], "motion": ["A single baton crosses the split and returns with evidence. Use clear pauses; no implication of built-in live synchronisation.", "Один естафетний блок перетинає поділ і повертається з доказами. Чіткі паузи; без натяку на вбудовану синхронізацію в реальному часі."], "lock": ["Preserve the two named modes, visible shared packet, cobalt/yellow/coral ratio and the return path as well as the outbound path.", "Зберегти два підписані режими, видимий спільний пакет, кобальтово-жовто-коралове співвідношення та зворотний маршрут поряд із прямим."]}, {"id": "07", "slug": "evidence-first", "name": ["Evidence First", "Спочатку докази"], "tag": ["A clear answer to: how do we know it works?", "Чітка відповідь: звідки знаємо, що працює?"], "desc": ["A restrained quality-led identity shows the trace from user request to verified result. It presents review and acceptance as part of the work, with honest unresolved states.", "Стримана ідентичність навколо якості показує шлях від запиту користувача до перевіреного результату. Перевірка й приймання — частина роботи, а невирішені стани видимі."], "bg": "#171918", "fg": "#F6F7F1", "accent": "#D6F577", "muted": "#A3AAA0", "card": "#262C26", "secondary": "#F0B279", "font": "Courier New, monospace", "form": "evidence", "audience": ["Engineering buyers, regulated or complex internal teams and technically sceptical users who need inspectable outputs.", "Інженерні покупці, складні внутрішні команди й технічно скептичні користувачі, яким потрібні результати для перевірки."], "visual": ["Graphite background, acid-lime marks, large requirement IDs and an intentionally readable evidence table. Example data is labelled as illustrative.", "Графітове тло, лаймові позначки, великі ID вимог і навмисно читабельна таблиця доказів. Приклад даних явно позначено як ілюстративний."], "story": ["Ask what “done” means. Attach acceptance criteria to a requirement. Show the implementation, QA finding and result. End with a real stop condition when evidence is missing.", "Запитати, що означає «готово». Прикріпити критерії приймання до вимоги. Показати реалізацію, зауваження QA та результат. Завершити реальною зупинкою, коли доказів бракує."], "motion": ["A requirement row gains links one by one. Pass/pending states appear only as an explanatory example; no rolling fake success counter.", "Рядок вимоги поступово отримує посилання. Стани passed/pending — лише пояснювальний приклад; без вигаданого лічильника успіху."], "lock": ["Preserve readable IDs, explicit example labels, three honest states and generous table spacing. Never use quality badges as certification.", "Зберегти читабельні ID, явні позначення прикладів, три чесні стани й вільну таблицю. Не подавати значки як сертифікацію."]}, {"id": "08", "slug": "launch-garden", "name": ["Launch Garden", "Сад розвитку"], "tag": ["Grow the project without losing its roots.", "Розвивай проєкт, зберігаючи його основу."], "desc": ["An organic yet structured system makes long-term evolution approachable. Roots are requirements; branches are specialist disciplines; new versions preserve project knowledge.", "Органічна, але структурована система робить довгий розвиток зрозумілим. Коріння — вимоги; гілки — спеціалізовані дисципліни; нові версії зберігають знання проєкту."], "bg": "#E9EDDC", "fg": "#203F32", "accent": "#3D6D45", "muted": "#738269", "card": "#F7F8EE", "secondary": "#C88E3D", "font": "Georgia, serif", "form": "garden", "audience": ["Long-running pet projects, independent products and owners who want continuity through updates.", "Довготривалі пет-проєкти, незалежні продукти й власники, що хочуть безперервності під час оновлень."], "visual": ["Sage paper, forest-green branching geometry and restrained seed-yellow markers. Product cards remain architectural, avoiding a generic botanical illustration.", "Шавлієвий папір, лісова зелень розгалуженої геометрії та стримані жовті маркери. Картки продуктів залишаються архітектурними без загальної ботанічної ілюстрації."], "story": ["Plant a clear requirement. Develop its relevant branches. Release a tested increment. Carry the project roots through the next system upgrade and rollback checkpoint.", "Закласти чітку вимогу. Розвинути потрібні гілки. Випустити перевірений крок. Перенести основу проєкту через наступне оновлення системи й контрольну точку відкату."], "motion": ["A branch extends only after a decision. Milestone rings record stages; roots stay visible. No promise of automatic growth, users or revenue.", "Гілка зростає лише після рішення. Кільця фіксують етапи; коріння лишається видимим. Без обіцянки автоматичного зростання, користувачів або доходу."], "lock": ["Preserve roots/branches meaning, sage/forest palette, curved connectors and clear milestone labels; do not replace the project with a new seed on update.", "Зберегти зміст коріння й гілок, шавлієво-зелену палітру, криві зв’язки та ясні етапи; під час оновлення не замінювати проєкт новим зерном."]}, {"id": "09", "slug": "human-and-system", "name": ["Human × System", "Людина × система"], "tag": ["Say what you need. Shape what happens next.", "Скажи, що потрібно. Визначай наступний крок."], "desc": ["A warm, conversational entrance lowers the barrier for non-specialists. Plain speech becomes a scoped plan, while meaningful decisions remain visible to the owner.", "Теплий розмовний початок знижує бар’єр для нефахівців. Звичайна мова перетворюється на узгоджений план, а важливі рішення лишаються видимими власнику."], "bg": "#F9E8DB", "fg": "#302D33", "accent": "#D45E40", "muted": "#8F7D77", "card": "#FFF9F2", "secondary": "#576FCC", "font": "Arial, sans-serif", "form": "dialogue", "audience": ["First-time users, small business owners and creators who do not yet know which specialist they need.", "Нові користувачі, власники малого бізнесу й автори, що ще не знають, який фахівець їм потрібен."], "visual": ["Warm peach, large human-readable dialogue, a blue scope card and terracotta decision controls. No robot mascot or anthropomorphic promise.", "Теплий персиковий, велика розмова людською мовою, синя картка масштабу й теракотові рішення. Без робота-талісмана або обіцянки людської свідомості."], "story": ["Open with a realistic vague request. Ask one useful question. Show the plan and owner choice. Reveal the specialist team and concrete next deliverable.", "Почати з реального нечіткого запиту. Поставити одне корисне питання. Показати план і вибір власника. Розкрити команду фахівців та конкретний наступний результат."], "motion": ["Dialogue appears at a readable pace; the owner’s choice opens the team panel. Always keep a static complete reading mode.", "Діалог з’являється в темпі читання; вибір власника відкриває панель команди. Завжди мати статичний режим повного читання."], "lock": ["Preserve large plain-language dialogue, warm neutral background, one visible decision and a concrete resulting artifact.", "Зберегти велику розмову простою мовою, тепле нейтральне тло, одне видиме рішення й конкретний артефакт у результаті."]}, {"id": "10", "slug": "open-canvas", "name": ["Open Canvas", "Відкрите полотно"], "tag": ["From one useful task to the world you want to build.", "Від корисної задачі до світу, який хочеш створити."], "desc": ["A panoramic canvas demonstrates range through precise miniature project specimens. The camera can travel between backend, integration, website, app, bot and mobile game without changing the method.", "Панорамне полотно показує діапазон через точні мініатюри проєктів. Камера переходить між бекендом, інтеграцією, сайтом, застосунком, ботом і мобільною грою зі спільним підходом."], "bg": "#EFECE5", "fg": "#24292F", "accent": "#E85B25", "muted": "#858981", "card": "#FAF8F2", "secondary": "#3F6BBA", "font": "Arial, sans-serif", "form": "canvas", "audience": ["A broad first encounter: GitHub visitors and marketplace buyers exploring what the system can help them build.", "Широке перше знайомство: відвідувачі GitHub і покупці майданчика, що досліджують можливості системи."], "visual": ["A warm infinite-workspace grid, vivid orange focus frame and six disciplined product specimens. Cropping guides preserve legibility at every ratio.", "Тепла сітка нескінченного робочого простору, виразна помаранчева рамка фокуса й шість впорядкованих зразків продуктів. Напрямні кадрування зберігають читабельність."], "story": ["Start on one backend card. Pan into integration, app and game specimens. Zoom out to one shared lifecycle, then focus on the viewer’s first brief.", "Почати з картки бекенду. Перейти до інтеграції, застосунку та гри. Віддалити до спільного життєвого циклу й зосередитися на першому запиті глядача."], "motion": ["Three deliberate pans, one final overview; avoid a dizzying endless zoom. Small-screen cuts use one specimen at a time.", "Три продумані переміщення й один фінальний загальний план; без запаморочливого нескінченного зуму. Для малих екранів — один зразок за раз."], "lock": ["Preserve the six specimen categories, orange focus bracket, warm grid and scale ladder; all tiny product UIs remain labelled illustrations.", "Зберегти шість категорій зразків, помаранчеву рамку фокуса, теплу сітку й шкалу масштабу; усі мініінтерфейси позначати як ілюстрації."]}];const boards={"01": {"en": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 1000\" width=\"1600\" height=\"1000\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Mission Control<\/title><desc id=\"desc\">A composed command centre turns an unclear request into a visible plan. Specialists have a purpose, the owner sees decisions, and progress is tied to evidence.<\/desc><rect x=\"0\" y=\"0\" width=\"1600\" height=\"1000\" rx=\"0\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><text x=\"64\" y=\"59\" fill=\"#F1F8F5\" font-size=\"15\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\" letter-spacing=\"2\">AGENT SYSTEM / 5.0.0<\/text><text x=\"1175\" y=\"59\" fill=\"#86A3A4\" font-size=\"13\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\" letter-spacing=\"1\">01 / DIRECTION STUDY<\/text><path d=\"M64 82L1536 82\" fill=\"none\" stroke=\"#86A3A4\" stroke-width=\"0.65\"/><text x=\"64\" y=\"151\" fill=\"#6DF1BE\" font-size=\"18\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\" letter-spacing=\"1\">Mission Control<\/text><text x=\"61\" y=\"229\" fill=\"#F1F8F5\" font-size=\"55\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">One brief. A team<\/text><text x=\"61\" y=\"290\" fill=\"#F1F8F5\" font-size=\"55\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">with a clear mission.<\/text><text x=\"64\" y=\"450\" fill=\"#86A3A4\" font-size=\"19\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"400\">A composed command centre turns an unclear request<\/text><text x=\"64\" y=\"478\" fill=\"#86A3A4\" font-size=\"19\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"400\">into a visible plan.<\/text><rect x=\"64\" y=\"555\" width=\"340\" height=\"43\" rx=\"5\" fill=\"#6DF1BE\" stroke=\"none\" stroke-width=\"1\"/><text x=\"82\" y=\"583\" fill=\"#0C1822\" font-size=\"16\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">Your brief → your team<\/text><rect x=\"790\" y=\"152\" width=\"742\" height=\"430\" rx=\"20\" fill=\"#142732\" stroke=\"none\" stroke-width=\"1\"/><text x=\"820\" y=\"192\" fill=\"#86A3A4\" font-size=\"14\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">PROJECT / ACTIVE BRIEF<\/text><text x=\"820\" y=\"238\" fill=\"#F1F8F5\" font-size=\"26\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">Recover a complex product<\/text><rect x=\"820\" y=\"261\" width=\"432\" height=\"38\" rx=\"5\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><text x=\"836\" y=\"286\" fill=\"#6DF1BE\" font-size=\"14\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">WORK  ↔  CODEX  /  checkpoint<\/text><rect x=\"820\" y=\"325\" width=\"455\" height=\"39\" rx=\"7\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"839\" cy=\"344\" r=\"4\" fill=\"#6DF1BE\" stroke=\"none\" stroke-width=\"1\"/><text x=\"855\" y=\"350\" fill=\"#F1F8F5\" font-size=\"17\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">Research<\/text><text x=\"1110\" y=\"350\" fill=\"#86A3A4\" font-size=\"13\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"400\">assigned<\/text><rect x=\"820\" y=\"376\" width=\"455\" height=\"39\" rx=\"7\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"839\" cy=\"395\" r=\"4\" fill=\"#6DF1BE\" stroke=\"none\" stroke-width=\"1\"/><text x=\"855\" y=\"401\" fill=\"#F1F8F5\" font-size=\"17\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">Design<\/text><text x=\"1110\" y=\"401\" fill=\"#86A3A4\" font-size=\"13\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"400\">assigned<\/text><rect x=\"820\" y=\"427\" width=\"455\" height=\"39\" rx=\"7\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"839\" cy=\"446\" r=\"4\" fill=\"#6DF1BE\" stroke=\"none\" stroke-width=\"1\"/><text x=\"855\" y=\"452\" fill=\"#F1F8F5\" font-size=\"17\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"700\">Build<\/text><text x=\"1110\" y=\"452\" fill=\"#86A3A4\" font-size=\"13\" font-family=\"DejaVu Sans, Arial, sans-serif\" font-weight=\"400\">assigned<\/text><rect x=\"820\" y=\"478\" width=\"455\" height=\"39\" rx=\"7\" fill=\"#0C1822\" stroke=\"none\" stroke-width=\"1\"/><circle cx=\"839\" cy=\"497\" r=\"4\" fill=\"#6DF1BE\" stroke=\ const ui={uk:{eyebrow:'10 різних напрямів / перед вибором',headline:'Якою має бути історія цієї системи?',intro:'Тут десять повноцінних графічних напрямів для однієї системи: від вузької архітектурної задачі до застосунку, гри або цілого продукту. У кожного — своя ідентичність, наочна команда, маршрут роботи й приклади задач.',note:'Це концепції для обговорення. Жоден напрям поки не затверджено. Ілюстрації пояснюють можливості та процес; вони не є доказами випущених продуктів чи виміряних переваг.',status:'Статус: напрям не обрано • версія концепцій 1.0 • 7 листопада 2026',hint:'Усі напрями мають однакові блоки: обкладинка, шлях роботи, шість типів задач.',prev:'← Попередній',next:'Наступний →',download:'Зберегти SVG',choose:'Скопіювати вибір',audience:'Для кого цей напрям',visual:'Графічна ідея',story:'Сценарій розкриття',motion:'Рух і розкадрування',lock:'Що має зберегтися у фіналі',palette:'Палітра та типографіка',adapt:'Адаптації після вибору',adaptText:'GitHub: заголовок + головна графіка. Презентація 16:9: історія → команда → процес → приклади → докази → перший бриф. Вертикаль 9:16: окремі зрозумілі кадри замість зменшення всього полотна. Соцмережі 1:1: одна теза, одна графіка. Фінальний PDF, відео та рекламні формати створюються після затвердження напряму.',proof:'Межі тверджень',proofText:'Справжні паралельні сабагенти, інструменти та платформи залежать від середовища. Показана команда — модель ролей, а не гарантія одночасного виконання. Порівняння з іншими інструментами потребують названих критеріїв і доказів; цифри економії, дохід, сертифікації та автоматичний успіх не вигадуються.',compareTitle:'Порівняння напрямів',th:['Напрям','Головний акцент','Аудиторія'],footer:'Незалежний комплект навичок і робочих процесів для сумісних середовищ. Не є офіційним продуктом OpenAI або GitHub. Макети інтерфейсів і приклади — ілюстративні. Жодних зовнішніх ресурсів: галерея працює офлайн.',copied:'Текст вибору скопійовано. Встав його в чат, щоб обговорити уточнення.',copyFail:'Копіювання недоступне. Текст вибору показано нижче.',choice:(c)=>`Обираю концепцію ${c.id} «${c.name[1]}» для презентації codex-agents. Спочатку узгодь уточнення. Збережи її палітру, типографіку, композиційну граматику, сенс графіки та інші правила ідентичності з marketing/concepts/${c.id}-${c.slug}.uk.md. Після узгодження розроби повний рекламний матеріал на основі цього напряму. Інші концепції не змішуй без окремого рішення.`},en:{eyebrow:'10 distinct directions / before selection',headline:'What story should this system tell?',intro:'Ten complete graphic directions for one system: from a focused architecture assignment to an app, game or whole product. Each has its own identity, a visible team, a workflow and concrete use cases.',note:'These are directions for discussion. None has been approved. Illustrations explain capabilities and process; they are not evidence of shipped products or measured advantages.',status:'Status: direction unselected • concept version 1.0 • 7 November 2026',hint:'Every direction has comparable panels: hero, workflow and six types of work.',prev:'← Previous',next:'Next →',download:'Save SVG',choose:'Copy selection',audience:'Who this direction is for',visual:'Graphic idea',story:'Narrative sequence',motion:'Motion and storyboard',lock:'Identity to preserve',palette:'Palette and typography',adapt:'Adaptations after selection',adaptText:'GitHub: headline + primary graphic. 16:9 presentation: story → team → process → examples → evidence → first brief. 9:16 vertical: separate readable frames instead of shrinking the whole board. 1:1 social: one claim, one graphic. Final PDF, video and advertising formats follow approval of a direction.',proof:'Claim boundaries',proofText:'Actual parallel subagents, tools and platforms depend on the environment. The team shown is a role model, not a guarantee of simultaneous execution. Comparisons with other tools need named criteria and evidence; savings, income, certifications and automatic success are not invented.',compareTitle:'Compare the directions',th:['Direction','Main emphasis','Audience'],footer:'An independent collection of skills and workflows for compatible environments. Not an official OpenAI or GitHub product. Interface mockups and examples are illustrative. No external resources: the gallery works offline.',copied:'Selection copied. Paste it into the conversation to discuss refinements.',copyFail:'Clipboard is unavailable. Your selection is shown below.',choice:(c)=>`I select concept ${c.id}, “${c.name[0]}”, for the codex-agents presentation. First agree the refinements. Preserve its palette, typography, composition grammar, graphic meaning and other identity rules in marketing/concepts/${c.id}-${c.slug}.en.md. After agreement, produce the full marketing material from this direction. Do not mix in other concepts without a separate decision.`}};
function storedLanguage(){try{return localStorage.getItem('agent-system-marketing-lang')}catch{return null}}function rememberLanguage(v){try{localStorage.setItem('agent-system-marketing-lang',v)}catch{}}
let lang=new URLSearchParams(location.search).get('lang')||storedLanguage()||'en';if(!ui[lang])lang='en';let index=Math.max(0,concepts.findIndex(c=>c.id===location.hash.replace('#','')));const e=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function render(){const t=ui[lang],l=lang==='uk'?1:0,c=concepts[index];document.documentElement.lang=lang;document.title=`${c.id} · ${c.name[l]} / Agent System`;['eyebrow','headline','intro','note','status','hint','prev','next','download','choose','compareTitle','footer'].forEach(id=>document.getElementById(id).textContent=t[id]);['uk','en'].forEach(k=>document.getElementById(k).classList.toggle('on',k===lang));document.getElementById('sidebar').innerHTML=concepts.map((d,i)=>`<button class="concept-button ${i===index?'active':''}" ${i===index?'aria-current="true"':''} onclick="select(${i})"><span class="num">${d.id}</span><span><span class="name">${e(d.name[l])}</span><span class="swatches">${[d.bg,d.accent,d.secondary].map(a=>`<i style="background:${a}"></i>`).join('')}</span></span></button>`).join('');document.getElementById('board').innerHTML=boards[c.id][lang];document.getElementById('details').innerHTML=['audience','visual','story','motion','lock'].map(k=>`<article class="detail ${k==='lock'?'wide':''}"><h2>${e(t[k])}</h2><p>${e(c[k][l])}</p></article>`).join('')+`<article class="detail wide"><h2>${e(t.palette)}</h2><p>${e(c.font)}</p><div class="palette">${[c.bg,c.fg,c.accent,c.secondary,c.card].map(a=>`<div class="color"><span style="background:${a}"></span>${a}</div>`).join('')}</div></article>`+['adapt','proof'].map(k=>`<article class="detail"><h2>${e(t[k])}</h2><p>${e(t[k+'Text'])}</p></article>`).join('');document.getElementById('compare').innerHTML=`<table><thead><tr>${t.th.map(h=>`<th scope="col">${e(h)}</th>`).join('')}</tr></thead><tbody>${concepts.map((d,i)=>`<tr><td><button onclick="select(${i});document.getElementById('board').scrollIntoView({block:'start'})" style="border:0;background:none;padding:0;text-align:left;color:inherit;font-weight:bold">${d.id} · ${e(d.name[l])}</button></td><td>${e(d.tag[l])}</td><td>${e(d.audience[l])}</td></tr>`).join('')}</tbody></table>`}
function select(i){index=i;try{history.replaceState(null,'',`${location.pathname}?lang=${lang}#${concepts[index].id}`)}catch{}render()}function move(d){select((index+d+concepts.length)%concepts.length)}function setLang(v){lang=v;rememberLanguage(v);select(index)}function downloadSvg(){const c=concepts[index],a=document.createElement('a'),url=URL.createObjectURL(new Blob([boards[c.id][lang]],{type:'image/svg+xml'}));a.href=url;a.download=`${c.id}-${c.slug}.${lang}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function copyChoice(){const t=ui[lang],s=t.choice(concepts[index]);try{await navigator.clipboard.writeText(s);const toast=document.getElementById('toast');toast.textContent=t.copied;toast.style.display='block';setTimeout(()=>toast.style.display='none',5000)}catch{window.prompt(t.copyFail,s)}}document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA')return;if(ev.key==='ArrowRight'){ev.preventDefault();move(1)}if(ev.key==='ArrowLeft'){ev.preventDefault();move(-1)}});render();
</script></body></html>
